# 取り込みが終わるまで syncPolicy.automated は書かない（手順書 1-4）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
  - repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      releaseName: cnpg
      valueFiles:
      - $values/k8s/apps/cloudnative-pg/values.yaml
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/apps/cloudnative-pg/manifests
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
