# 取り込みが終わるまで syncPolicy.automated は書かない（手順書 1-4）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pricetracker
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: pricetracker
  source:
    repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/apps/pricetracker/manifests
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
