# 取り込みが終わるまで syncPolicy.automated は書かない（手順書 1-4）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  sources:
  - repoURL: https://charts.netbox.oss.netboxlabs.com/
    chart: netbox
    targetRevision: 8.3.91
    helm:
      releaseName: netbox
      valueFiles:
      - $values/k8s/apps/netbox/values.yaml
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/apps/netbox/manifests
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
