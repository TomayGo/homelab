apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jr-radio
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: jr-radio
  source:
    repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/apps/jr-radio/manifests
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
    - ServerSideApply=true
