# 取り込みが終わるまで syncPolicy.automated は書かない（手順書 1-4）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
      - $values/k8s/apps/kube-prometheus-stack/values.yaml
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    ref: values
  - repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/apps/kube-prometheus-stack/manifests
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
