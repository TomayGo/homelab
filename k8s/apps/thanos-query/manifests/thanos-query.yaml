apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: thanos-query
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: thanos-query
    spec:
      # 2 台を必ず別ノードに置く
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: thanos-query
      containers:
      - args:
        - query
        - --http-address=0.0.0.0:9090
        - --grpc-address=0.0.0.0:10901
        - --endpoint=dnssrv+_grpc._tcp.prometheus-operated.monitoring.svc.cluster.local
        - --query.replica-label=prometheus_replica
        # PVE exporter の job=pve は 3 台から同じ系列を取っている（kube-prometheus-stack の values.yaml）
        - --query.replica-label=pve_exporter
        # 重いクエリで Prometheus と thanos-query が memory limit に張り付き、limit の内側で
        # ページの読み直しを続けて etcd と同じディスクを詰まらせた（2026-11-19、30 日表示の
        # PVE ダッシュボード 83 パネルを既定の 20 並列で両 Prometheus に流した）。
        # 主な対策は同時実行数。あふれたクエリは --query.timeout（既定 2m）まで待つ。
        - --query.max-concurrent=4
        # 1 回の Series 要求の上限。全ダッシュボードの変数を「全部」にしたときの最大は
        # 2756 系列（grafana_http_request_duration_seconds_bucket、15 日分）。
        # samples は 30 秒間隔で 2756 系列 × 7 日 ≈ 5600 万が通る値にしてある。
        - --store.limits.request-series=10000
        - --store.limits.request-samples=60000000
        image: quay.io/thanos/thanos:v0.42.5
        imagePullPolicy: IfNotPresent
        name: thanos-query
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 10901
          name: grpc
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 112Mi
          limits:
            # 288Mi では 30 日表示のときに limit に張り付き、OOM にもならずに読み直しを続けた
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 9090
    protocol: TCP
    targetPort: 9090
  - name: grpc
    port: 10901
    protocol: TCP
    targetPort: 10901
  selector:
    app: thanos-query
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.io/ip-allocated-from-pool: lan-pool
  name: thanos-query-lb
  namespace: monitoring
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 30423
    port: 80
    protocol: TCP
    targetPort: 9090
  selector:
    app: thanos-query
  type: LoadBalancer
