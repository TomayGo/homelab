# JR 在来線デジタル列車無線の受信機（TomayGo/jr-radio-web = soltia48/jr-conventional-line-radio-receiver v1.6.0 の Web サーバー版）
# IQ は LXC 104 sdr（192.168.1.86:1240）の rtl_tcp から受ける。rtl_tcp は同時に 1 クライアントだけなので、レプリカは常に 1
# 受信セッションと録音はこの Pod の中にある。JRW_AUTOSTART で、起動時に保存済みの設定（/data/config/settings.json）で受信と録音を始め、
# 落ちたら 10 秒ごとにやり直す。画面で「停止」を押したあとは、次の「受信開始」までやり直さない
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jr-radio
  namespace: jr-radio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jr-radio
  template:
    metadata:
      labels:
        app: jr-radio
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # 終了時に録音を閉じる（WAV のヘッダーと session.json を書き切る）
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jr-radio
          image: ghcr.io/tomaygo/jr-radio-web:sha-e8f5baa
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JRW_AUTOSTART
              value: "1"
            # 確定した通話の WAV を、1 分ごとに Ogg Opus（16 kbps）にして WAV を消す（約 1/8）
            - name: JRW_OPUS_BITRATE
              value: "16000"
            # 設定ファイル（/data/config/settings.json）がまだ無いときの初期値。画面で変えた値はそちらに残る
            - name: JRW_DEFAULT_HOST
              value: 192.168.1.86
            - name: JRW_DEFAULT_PORT
              value: "1240"
            - name: JRW_DEFAULT_PROFILE
              value: east
            - name: JRW_DEFAULT_CENTER_MHZ
              value: "352.603125"
            - name: JRW_DEFAULT_RATE
              value: "240000"
            # 2026-10-17 の掃引（pve-2 の窓際、2 巡）で決めた。25.4 → 40.2 で東北本線 D1 音声の同期率が 0.87 → 0.90、
            # 仙石線はどの手動ゲインでも 1.00 で、42.1（−10 dBFS）でも飽和しない。40.2 は入力 −12.7 dBFS で余裕を残す値
            # 自動ゲインでは ADC が飽和し（+0.5 dBFS）、東北本線とデータ波が落ちる
            # 2026-10-18、ダイポール素子を 3/4 波長から最短（約 23 cm、1/4 波長相当）に縮めたあとの掃引（2 巡）で 43.4 にした。
            # 弱い D3 音声第1波の同期率が 40.2 で 63〜69%、43.4 で 71%。48.0（−4 dBFS）以上では D3 が消える（強い D1/D2 で飽和）
            - name: JRW_DEFAULT_GAIN_DB
              value: "43.4"
            # 残留の +200 Hz 程度はアプリが追従する
            - name: JRW_DEFAULT_PPM
              value: "0"
            - name: TZ
              value: Asia/Tokyo
          envFrom:
            - secretRef:
                name: jr-radio-auth
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 4
          # 240 kS/s の復調と音声合成。値は仮置きで、動かしてから 7 日間の p95 に合わせる
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jr-radio-data
