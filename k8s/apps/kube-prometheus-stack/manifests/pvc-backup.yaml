# PVC を tar → zstd -19 → Cloudflare R2 に送る（images/backup-tools/pvc-backup.sh）。2世代残す
# R2 の認証情報は Secret r2-backup（SOPS）。2026-10-09 に有効化した（docs/phase2.md）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-prometheus
  namespace: monitoring
spec:
  schedule: 30 3 * * *
  timeZone: Asia/Tokyo
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr-pull
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    statefulset.kubernetes.io/pod-name: prometheus-kube-prometheus-stack-prometheus-0
          securityContext:
            runAsUser: 1000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:sha-66c0fe7
            env:
            - name: BACKUP_NAME
              value: monitoring/prometheus
            - name: SRC_DIR
              value: /src/prometheus-db
            - name: EXCLUDES
              value: wal chunks_head lock queries.active
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: HOME
              value: /tmp
            envFrom:
            - secretRef:
                name: r2-backup
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '2'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: db
              mountPath: /src
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: db
            persistentVolumeClaim:
              claimName: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
              readOnly: true
          - name: tmp
            emptyDir: {}
