# Cloudflare R2 の使用量（保存量と今月の Class A/B 操作数）を GraphQL Analytics API から取り、
# Prometheus 形式で出す。無料枠に対するアラートは values.yaml の r2 グループ
# API トークン（Account Analytics: Read）とアカウント ID は Secret r2-usage-exporter（SOPS）。
# scripts/enable-r2-usage-alert.sh で作る
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2-usage-exporter
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: r2-usage-exporter
  template:
    metadata:
      labels:
        app: r2-usage-exporter
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: exporter
        image: python:3.15-slim@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /scripts/r2_usage_exporter.py
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        envFrom:
        - secretRef:
            name: r2-usage-exporter
        ports:
        - containerPort: 9877
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 30
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /scripts
          name: script
      volumes:
      - name: script
        configMap:
          name: r2-usage-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: r2-usage-exporter
  namespace: monitoring
spec:
  ports:
  - name: metrics
    port: 9877
    protocol: TCP
    targetPort: metrics
  selector:
    app: r2-usage-exporter
  type: ClusterIP
