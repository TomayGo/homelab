# クローン PVC の storage は元の PVC 以上にする（元の PVC を広げたらここも直す。小さいとプロビジョニングに失敗する）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-prometheus
spec:
  schedule: 30 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: snap-backup
            image: ghcr.io/tomaygo/backup-tools:sha-01d8a40
            env:
            - name: SNAP_PVCS
              value: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
            - name: RUN_CRONJOB
              value: pvc-backup-prometheus-run
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-prometheus-run
spec:
  schedule: 30 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 2000
            runAsNonRoot: true
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:sha-01d8a40
            env:
            - name: BACKUP_NAME
              value: monitoring/prometheus
            - name: ZSTD_THREADS
              value: '6'
            - name: SRC_DIR
              value: /src/prometheus-db
            - name: EXCLUDES
              value: wal chunks_head lock queries.active
            securityContext:
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: db
              mountPath: /src
          volumes:
          - name: db
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    app.kubernetes.io/managed-by: snap-backup
                spec:
                  accessModes:
                  - ReadWriteOnce
                  storageClassName: ceph-rbd
                  dataSource:
                    apiGroup: snapshot.storage.k8s.io
                    kind: VolumeSnapshot
                    name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0-backup
                  resources:
                    requests:
                      storage: 20Gi
