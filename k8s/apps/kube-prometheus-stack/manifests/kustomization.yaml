apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc-backup
  - dashboards.yaml
  - discord-bridge.yaml
  - r2-usage-exporter.yaml
  - hostapd-external.yaml
  - namespace.yaml
generators:
  - secret-generator.yaml
# ダッシュボードの JSON は dashboards/ に、discord-bridge と r2-usage-exporter のスクリプトは scripts/ に置く
# スクリプトを変えると ConfigMap 名のハッシュが変わり、Deployment がロールする
# （prune はオフなので、古い名前の ConfigMap は残る。kubectl -n monitoring get configmap で見て手で消す）
# ダッシュボードの名前は固定（Grafana サイドカーはラベルで拾う）
configMapGenerator:
  - name: discord-bridge-script
    namespace: monitoring
    files:
      - scripts/bridge.py
  - name: r2-usage-exporter-script
    namespace: monitoring
    files:
      - scripts/r2_usage_exporter.py
  - name: dashboard-proxmox-ve-cluster
    namespace: monitoring
    files:
      - dashboards/proxmox-ve-cluster.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-wifi-ap
    namespace: monitoring
    files:
      - dashboards/wifi-ap.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
