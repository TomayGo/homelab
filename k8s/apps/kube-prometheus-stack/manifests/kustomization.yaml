apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc-backup.yaml
  - dashboards.yaml
  - discord-bridge.yaml
  - hostapd-external.yaml
  - namespace.yaml
generators:
  - secret-generator.yaml
# ダッシュボードの JSON は dashboards/ に置く。名前は固定（Grafana サイドカーはラベルで拾う）
configMapGenerator:
  - name: dashboard-proxmox-ve-cluster
    namespace: monitoring
    files:
      - dashboards/proxmox-ve-cluster.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-wifi-ap
    namespace: monitoring
    files:
      - dashboards/wifi-ap.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
