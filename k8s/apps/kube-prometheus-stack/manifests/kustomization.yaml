apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc-backup.yaml
  - dashboards.yaml
  - discord-bridge.yaml
  - r2-usage-exporter.yaml
  - hostapd-external.yaml
  - namespace.yaml
generators:
  - secret-generator.yaml
# ダッシュボードの JSON は dashboards/ に、discord-bridge と r2-usage-exporter のスクリプトは scripts/ に置く
# ダッシュボードの名前は固定（Grafana サイドカーはラベルで拾う）
# スクリプトの ConfigMap も名前を固定している。中身を変えても Pod は自動ではロールしない
# （discord-bridge.yaml の restartedAt を書き換えるか、kubectl rollout restart する）
configMapGenerator:
  - name: discord-bridge-script
    namespace: monitoring
    files:
      - scripts/bridge.py
    options:
      disableNameSuffixHash: true
  - name: r2-usage-exporter-script
    namespace: monitoring
    files:
      - scripts/r2_usage_exporter.py
    options:
      disableNameSuffixHash: true
  - name: dashboard-proxmox-ve-cluster
    namespace: monitoring
    files:
      - dashboards/proxmox-ve-cluster.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-wifi-ap
    namespace: monitoring
    files:
      - dashboards/wifi-ap.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
