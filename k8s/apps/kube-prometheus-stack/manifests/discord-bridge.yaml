apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bridge
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: discord-bridge
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: discord-bridge
    spec:
      # 2 台を必ず別ノードに置く
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: discord-bridge
      containers:
      - command:
        - python3
        - /scripts/bridge.py
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        envFrom:
        - secretRef:
            name: discord-bridge-config
        image: python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
        imagePullPolicy: IfNotPresent
        name: bridge
        ports:
        - containerPort: 9095
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 160Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts
          name: script
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      # 通し番号の状態（ConfigMap discord-bridge-state）を読み書きする
      serviceAccountName: discord-bridge
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: discord-bridge-script
        name: script
---
apiVersion: v1
kind: Service
metadata:
  name: discord-bridge
  namespace: monitoring
spec:
  ports:
  - port: 9095
    protocol: TCP
    targetPort: 9095
  selector:
    app: discord-bridge
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discord-bridge
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discord-bridge
  namespace: monitoring
rules:
# create は resourceNames で絞れないので分けて書く
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [discord-bridge-state]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: discord-bridge
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: discord-bridge
subjects:
- kind: ServiceAccount
  name: discord-bridge
  namespace: monitoring
