additionalPrometheusRulesMap:
  migrated-alert-rules:
    groups:
    - name: node
      rules:
      - alert: NodeDown
        annotations:
          description: node_exporter ({{ $labels.instance }}) is not responding
          summary: Node {{ $labels.node }} is DOWN
        expr: up{job="node"} == 0
        for: 30s
        labels:
          severity: critical
      # 8845HS は負荷時に Tctl 89°C を目標にブーストする（Tjmax 100°C）。
      # 夜間の PVC バックアップ（zstd -19）や vzdump で 10 分ほど 85°C 前後になるのは正常なので、
      # warning は 15 分間ずっと 85°C 超、critical はブースト目標を超えたまま 1 分続いたときにする
      - alert: HighCpuTemperature
        annotations:
          description: CPU temperature above 95°C (past the 89°C boost target) for 1 minute - cooling may have failed
          summary: '{{ $labels.node }} CPU temp {{ $value }}°C'
        expr: node_hwmon_temp_celsius{chip="pci0000:00_0000:00:18_3",sensor="temp1"}
          > 95
        for: 1m
        labels:
          severity: critical
      - alert: HighCpuTemperatureWarning
        annotations:
          description: CPU temperature stayed above 85°C for the last 15 minutes
          summary: '{{ $labels.node }} CPU temp >= {{ $value }}°C for 15m'
        expr: min_over_time(node_hwmon_temp_celsius{chip="pci0000:00_0000:00:18_3",sensor="temp1"}[15m])
          > 85
        for: 1m
        labels:
          severity: warning
      # ファン回転数は ITE IT8613E を /dev/port から読んだ値（Ansible ロール superio_fan、15 秒ごと）。
      # 平常時は cpu 950〜1600 rpm（全コア負荷で約 3150）、system 1650〜1900 rpm。0 はパルスが来ていない（停止）
      - alert: CpuFanStalled
        annotations:
          summary: '{{ $labels.node }} の CPU ファンが止まっている（0 rpm）'
          description: 'IT8613E の FAN_TAC{{ $labels.tach }} にパルスが来ていない。CPU 温度を見て、上がっていれば負荷を逃がす（pvectl で退避）。8845HS は 100°C でスロットリングする'
        expr: superio_fan_rpm{fan="cpu"} == 0
        for: 1m
        labels:
          severity: critical
      - alert: SystemFanStalled
        annotations:
          summary: '{{ $labels.node }} のシステムファンが止まっている（0 rpm）'
          description: 'IT8613E の FAN_TAC{{ $labels.tach }} にパルスが来ていない。NVMe と基板の温度が上がる'
        expr: superio_fan_rpm{fan="system"} == 0
        for: 5m
        labels:
          severity: warning
      # 書かれていないと上の 2 つが黙るので、それ自体を知らせる
      - alert: FanMetricsStale
        annotations:
          summary: '{{ $labels.node }} のファン回転数が 5 分以上更新されていない'
          description: 'systemctl status superio-fan-metrics.timer / journalctl -u superio-fan-metrics を見る。superio_fan_up が 0 なら IT8613E が ITE の vendor ID を返していない'
        expr: |
          (time() - node_textfile_mtime_seconds{file=~".*/superio-fan\\.prom"} > 300)
          or
          (superio_fan_up == 0)
          or
          (up{job="node"} == 1 unless on(node) node_textfile_mtime_seconds{file=~".*/superio-fan\\.prom"})
        for: 10m
        labels:
          severity: warning
      # superio-fan-control（CPU ファンの起動 PWM を Tctl の 5 分平均で動かすデーモン）。止まってもチップの
      # カーブはそのまま動くので warning。active=0 は起動時にカーブのレジスタが想定と違って制御を断った状態
      - alert: FanControlDown
        annotations:
          summary: '{{ $labels.node }} の superio-fan-control が CPU ファンを制御していない'
          description: 'journalctl -u superio-fan-control を見る。"fan curve registers are not what this controller was tuned for" なら BIOS の更新などでカーブが変わっている。測り直してから superio_fan_control_expect を直す'
        expr: |
          (superio_fan_control_active == 0)
          or
          (time() - node_textfile_mtime_seconds{file=~".*/superio-fan-control\\.prom"} > 300)
          or
          (up{job="node"} == 1 unless on(node) node_textfile_mtime_seconds{file=~".*/superio-fan-control\\.prom"})
        for: 10m
        labels:
          severity: warning
      - alert: HighCpuUsage
        annotations:
          summary: '{{ $labels.node }} CPU usage {{ $value | printf "%.1f" }}%'
        expr: (1 - avg by(node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) *
          100 > 90
        for: 30s
        labels:
          severity: warning
      # pve-1 は VM の固定割り当て（mc 12G + talos-cp-1 8G + ap 2G）と ceph-osd で平常時 84〜86% になる。
      # 85% / 30s だと境界を行き来して鳴りっぱなしになるので、warning は 90% を 10 分、
      # critical は MemAvailable が 1.5G 程度（95%）まで減ったときにする。keep_firing_for で境界の往復を抑える
      - alert: HighMemoryUsage
        annotations:
          summary: '{{ $labels.node }} memory usage {{ $value | printf "%.1f" }}%'
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) *
          100 > 95
        for: 2m
        labels:
          severity: critical
      - alert: HighMemoryUsageWarning
        annotations:
          summary: '{{ $labels.node }} memory usage {{ $value | printf "%.1f" }}%'
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) *
          100 > 90
        for: 10m
        keep_firing_for: 10m
        labels:
          severity: warning
      - alert: DiskSpaceLow
        annotations:
          summary: '{{ $labels.node }} disk space low on {{ $labels.mountpoint }}'
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes)
          * 100 > 90
        for: 30s
        labels:
          severity: critical
    - name: r2
      # Cloudflare R2 の無料枠（アカウント全体・月あたり）: 保存 10 GB-month、Class A 100 万回、Class B 1000 万回。
      # 80% で warning、90% で critical。GB は 10^9 として早めに出す。保存量は請求上は「日ごとの最大値の月平均」だが、
      # ここでは今の保存量で見る（この量が続くと月平均もそこに寄る）。操作数は UTC の暦月の累計
      # 値は manifests/r2-usage-exporter.yaml が Cloudflare GraphQL API から 10 分ごとに取る
      rules:
      - alert: R2StorageFreeTierWarning
        annotations:
          summary: 'R2 保存量が無料枠の {{ $value | humanizePercentage }}（10 GB 中）'
          description: 古い世代や CNPG の retentionPolicy を見直す。90% で critical になる
        expr: sum(max by(bucket) (r2_storage_bytes)) / 10e9 > 0.8
        for: 30m
        labels:
          severity: warning
      - alert: R2StorageFreeTierCritical
        annotations:
          summary: 'R2 保存量が無料枠の {{ $value | humanizePercentage }}（10 GB 中）'
          description: このままだと月平均が 10 GB-month を超えて課金される
        expr: sum(max by(bucket) (r2_storage_bytes)) / 10e9 > 0.9
        for: 30m
        labels:
          severity: critical
      - alert: R2ClassAOpsFreeTierWarning
        annotations:
          summary: 'R2 Class A 操作が今月の無料枠の {{ $value | humanizePercentage }}（100 万回中）'
          description: PutObject / UploadPart / ListObjects など。内訳は r2_operations_month_to_date{class="A"}
        expr: sum(max by(action) (r2_operations_month_to_date{class="A"})) / 1e6 > 0.8
        for: 15m
        labels:
          severity: warning
      - alert: R2ClassAOpsFreeTierCritical
        annotations:
          summary: 'R2 Class A 操作が今月の無料枠の {{ $value | humanizePercentage }}（100 万回中）'
          description: PutObject / UploadPart / ListObjects など。内訳は r2_operations_month_to_date{class="A"}
        expr: sum(max by(action) (r2_operations_month_to_date{class="A"})) / 1e6 > 0.9
        for: 15m
        labels:
          severity: critical
      - alert: R2ClassBOpsFreeTierWarning
        annotations:
          summary: 'R2 Class B 操作が今月の無料枠の {{ $value | humanizePercentage }}（1000 万回中）'
          description: GetObject / HeadObject など。内訳は r2_operations_month_to_date{class="B"}
        expr: sum(max by(action) (r2_operations_month_to_date{class="B"})) / 1e7 > 0.8
        for: 15m
        labels:
          severity: warning
      - alert: R2ClassBOpsFreeTierCritical
        annotations:
          summary: 'R2 Class B 操作が今月の無料枠の {{ $value | humanizePercentage }}（1000 万回中）'
          description: GetObject / HeadObject など。内訳は r2_operations_month_to_date{class="B"}
        expr: sum(max by(action) (r2_operations_month_to_date{class="B"})) / 1e7 > 0.9
        for: 15m
        labels:
          severity: critical
      # 取れていないと上のアラートが黙るので、それ自体を知らせる
      - alert: R2UsageExporterStale
        annotations:
          summary: R2 の使用量を 1 時間以上取れていない
          description: r2-usage-exporter のログを見る（API トークンの失効・権限など）。この間は R2 の無料枠アラートが出ない
        expr: absent(r2_exporter_last_success_timestamp_seconds) or (time() - max(r2_exporter_last_success_timestamp_seconds)) > 3600
        for: 15m
        labels:
          severity: warning
    - name: exporters
      rules:
      - alert: AdguardExporterDown
        annotations:
          summary: AdGuard Exporter is DOWN
        expr: up{job="adguard"} == 0
        for: 30s
        labels:
          severity: warning
      - alert: CephExporterDown
        annotations:
          summary: Ceph Exporter is DOWN
        expr: up{job="ceph"} == 0
        for: 30s
        labels:
          severity: warning
      - alert: PveExporterDown
        annotations:
          description: job=pve は残りの exporter で続くが、3 台とも落ちると pve_* がすべて消える
          summary: 'PVE exporter is DOWN: {{ $labels.job }} {{ $labels.pve_exporter }} {{ $labels.instance }}'
        expr: up{job=~"pve|pve-node"} == 0
        for: 5m
        labels:
          severity: warning
      - alert: FrrExporterDown
        annotations:
          summary: '{{ $labels.node }} FRR Exporter is DOWN'
        expr: up{job="frr"} == 0
        for: 30s
        labels:
          severity: warning
      - alert: HostapdExporterDown
        annotations:
          description: Wi-Fi AP monitoring is unavailable
          summary: hostapd exporter (VM103) is DOWN
        expr: up{job="hostapd"} == 0
        for: 30s
        labels:
          severity: critical
    - name: hostapd
      rules:
      - alert: HostapdDown
        annotations:
          description: hostapd_up=0 on VM103 - the AP daemon is down, all bands are
            offline
          summary: hostapd process is not running
        expr: hostapd_up == 0
        for: 2m
        labels:
          severity: critical
      - alert: HostapdBandDown
        annotations:
          description: Interface {{ $labels.interface }} is not up in AP mode - clients
            on {{ $labels.band }} cannot associate
          summary: Wi-Fi band {{ $labels.band }} ({{ $labels.interface }}) is down
        expr: hostapd_interface_up == 0
        for: 10m
        labels:
          severity: warning
      - alert: WifiDriverErrors
        annotations:
          description: Driver {{ $labels.driver }} may be unstable
          summary: Wi-Fi driver flush queue timeouts rising ({{ $value | printf "%.1f"
            }}/s)
        expr: rate(wifi_flush_queue_timeouts_total[5m]) > 1
        for: 30s
        labels:
          severity: warning
    # USB4 メッシュ（pve-1/2/3 の tb0/tb1、OSPF + ECMP）。Ceph の cluster_network と corosync ring1 が乗っている。
    # 1 本切れても残り 2 本で迂回できるので warning、ホストが OSPF の隣接をすべて失ったら critical
    - name: thunderbolt
      rules:
      # thunderbolt-net の netdev はピアが見えなくなると消える（DOWN ではなく存在しなくなる）ので、
      # node_exporter が生きているのに tb0/tb1 の系列が無いことも断として扱う
      - alert: ThunderboltMeshLinkDown
        annotations:
          summary: '{{ $labels.node }} の {{ $labels.device }} が down（または存在しない）'
          description: OSPF の隣接と ip -br link を確認する。ピア側だけ NO-CARRIER のことがある（片側だけ見ない）
        expr: |
          (node_network_up{job="node", device=~"tb[01]"} == 0)
          or
          (label_replace(up{job="node"} == 1, "device", "tb0", "", "") unless on(node, device) node_network_up{device="tb0"})
          or
          (label_replace(up{job="node"} == 1, "device", "tb1", "", "") unless on(node, device) node_network_up{device="tb1"})
        for: 2m
        labels:
          severity: warning
      # link up でも通らない gray failure（7-22）やケーブルの差し違え（10-18）はこちらで拾う。値は Full の隣接数
      - alert: OspfMeshNeighborsLow
        annotations:
          summary: '{{ $labels.node }} の OSPF Full ネイバーが {{ $value }}（2 未満）'
          description: vtysh -c 'show ip ospf neighbor' で状態を見る。片方のリンクだけなら残りの経路で迂回している
        expr: |
          (
            count by(node) (frr_ospf_neighbor_state{iface=~"tb[01]"} == 7)
            or on(node)
            sum by(node) (up{job="frr"} == 1) * 0
          ) < 2
        for: 2m
        labels:
          severity: warning
      - alert: OspfMeshIsolated
        annotations:
          summary: '{{ $labels.node }} が USB4 メッシュから切れている（OSPF Full ネイバー 0）'
          description: このホストの Ceph cluster_network と corosync ring1 が通らない。OSD down・PG degraded になる
        expr: |
          (
            count by(node) (frr_ospf_neighbor_state{iface=~"tb[01]"} == 7)
            or on(node)
            sum by(node) (up{job="frr"} == 1) * 0
          ) == 0
        for: 1m
        labels:
          severity: critical
      # 以下は tb-storm-watchdog.sh（ロール thunderbolt_net）が textfile collector に書く値
      - alert: TbStormWatchdogUnbound
        annotations:
          summary: '{{ $labels.node }} で tb-storm-watchdog が NHI {{ $labels.pci }}（domain{{ $labels.domain }}）を unbind した'
          description: '{{ $value | humanizeTimestamp }}（UTC）にイベントストームを止めるために外した。bind し直さず、ケーブルを確認してからホストを再起動する（再起動で消える）。journalctl -t tb-storm-watchdog'
        expr: tb_storm_watchdog_unbind_timestamp_seconds > 0
        for: 0m
        labels:
          severity: warning
      # watchdog 以外（手動や watchdog 導入前）で外れたままの NHI。watchdog が外したものは上で出す
      - alert: ThunderboltNhiUnbound
        annotations:
          summary: '{{ $labels.node }} の NHI {{ $labels.pci }} に driver が bind されていない'
          description: そのホストの片方のメッシュリンクが使えない。bind し直さず（wedge した NHI への bind は kworker が D 状態で残る）、ケーブルを確認してから再起動する
        expr: |
          tb_nhi_bound == 0
          unless on(node, pci) tb_storm_watchdog_unbind_timestamp_seconds
        for: 5m
        labels:
          severity: warning
      # unbind されないまま続くストーム。もう片方が unbind 済みで止めた、DRY_RUN、unbind 失敗のどれか。
      # カーネルメモリが 2.5〜4 GB/日リークし続ける。50 は watchdog の THRESHOLD（5 秒あたり）
      - alert: ThunderboltEventStorm
        annotations:
          summary: '{{ $labels.node }} の domain{{ $labels.domain }}（{{ $labels.pci }}）で TB イベントが 5 秒に {{ $value }} 件'
          description: watchdog が unbind していない。journalctl -t tb-storm-watchdog で理由を見る。止めるには unbind か再起動
        expr: tb_storm_watchdog_events > 50
        for: 3m
        labels:
          severity: critical
      # 書かれていないと上の 3 つが黙るので、それ自体を知らせる（timer は 1 分ごと）
      - alert: TbStormWatchdogStale
        annotations:
          summary: '{{ $labels.node }} の tb-storm-watchdog が 10 分以上結果を書いていない'
          description: systemctl status tb-storm-watchdog.service / journalctl -u tb-storm-watchdog を見る。この間はストームの検知と自動 unbind が止まっている
        expr: |
          (time() - node_textfile_mtime_seconds{file=~".*/tb-storm-watchdog\\.prom"} > 600)
          or
          (up{job="node"} == 1 unless on(node) node_textfile_mtime_seconds{file=~".*/tb-storm-watchdog\\.prom"})
        for: 15m
        labels:
          severity: warning
    # mgr の prometheus module は active な mgr だけが値を返し、instance がその mgr になる。
    # mgr が切り替わってもアラートが続くように instance を落とす
    - name: ceph
      rules:
      # 7-22 は USB4 の gray failure で cluster_network が詰まり、IO が 11 分止まった
      - alert: CephOsdSlowOps
        annotations:
          summary: '{{ $labels.ceph_daemon }} に slow ops が {{ $value }} 件'
          description: ceph health detail で詰まっている OSD を確かめる。メッシュ（tb0/tb1、OSPF）のアラートも見る
        expr: max by(ceph_daemon) (ceph_daemon_health_metrics{type="SLOW_OPS", ceph_daemon=~"osd\\..*"}) > 0
        for: 1m
        labels:
          severity: warning
      - alert: CephOsdSlowOpsCritical
        annotations:
          summary: '{{ $labels.ceph_daemon }} の slow ops が 5 分続いている（{{ $value }} 件）'
          description: その OSD を使う RBD（k8s の PVC、VM ディスク）の IO が止まっている可能性が高い。ceph health detail とメッシュの状態を見る
        expr: max by(ceph_daemon) (ceph_daemon_health_metrics{type="SLOW_OPS", ceph_daemon=~"osd\\..*"}) > 0
        for: 5m
        labels:
          severity: critical
alertmanager:
  alertmanagerSpec:
    # 2 台を必ず別ノードに置く（既定の soft では同じノードに並ぶことがある）
    podAntiAffinity: hard
    replicas: 2
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: discord
      webhook_configs:
      - send_resolved: true
        url: http://discord-bridge.monitoring.svc.cluster.local:9095/
    - name: "null"
    route:
      group_by:
      - alertname
      group_interval: 5m
      group_wait: 30s
      receiver: discord
      repeat_interval: 4h
      routes:
      # Watchdog は常に firing している死活確認用、InfoInhibitor は抑制用。どちらも通知しない
      - matchers:
        - alertname=~"Watchdog|InfoInhibitor"
        receiver: "null"
      # R2 の無料枠は月末まで戻らないので、4 時間ごとに繰り返すと Discord が埋まる。1 日 1 回にする
      - matchers:
        - alertname=~"R2.*FreeTier.*"
        receiver: discord
        repeat_interval: 24h
grafana:
  # 管理者の認証情報は manifests/grafana-admin.enc.yaml（SOPS）。未指定だと chart が乱数で生成し、Argo CD では描画のたびに変わる
  admin:
    existingSecret: kube-prometheus-stack-grafana
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
  - access: proxy
    isDefault: true
    name: thanos-query
    type: prometheus
    url: http://thanos-query.monitoring.svc.cluster.local:9090
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        key: password
        name: grafana-db-app
  grafana.ini:
    database:
      host: grafana-db-rw.monitoring.svc.cluster.local:5432
      name: grafana
      type: postgres
      user: grafana
  persistence:
    enabled: false
  replicas: 2
  # 2 台を必ず別ノードに置く
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: kube-prometheus-stack
            app.kubernetes.io/name: grafana
  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 1280Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      isDefaultDatasource: false
    # dashboard / datasources の両サイドカー共通
    resources:
      requests:
        cpu: 10m
        memory: 112Mi
      limits:
        memory: 192Mi
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi
kubeScheduler:
  enabled: false
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 160Mi
  # Prometheus / Alertmanager の config-reloader 共通
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
    - job_name: adguard
      static_configs:
      - targets:
        - adguard-exporter.dns.svc.cluster.local:9618
    # クラスタ全体（ゲスト・ストレージ・HA など）。どのノードの exporter も同じ内容を返すので 3 台とも取り、
    # instance を共通にして pve_exporter だけが違う 3 本にする。thanos-query が pve_exporter を
    # replica ラベルとして 1 本にまとめるので、1 台落ちても途切れない（以前は pve-1 だけで単一障害点だった）
    - job_name: pve
      metrics_path: /pve
      params:
        cluster:
        - "1"
        module:
        - default
        node:
        - "0"
        target:
        - localhost
      static_configs:
      - labels:
          pve_exporter: pve-1
        targets:
        - 192.168.1.79:9221
      - labels:
          pve_exporter: pve-2
        targets:
        - 192.168.1.80:9221
      - labels:
          pve_exporter: pve-3
        targets:
        - 192.168.1.81:9221
      relabel_configs:
      - target_label: instance
        replacement: pve-cluster
    # ノード単位（onboot など）は、そのノード上のゲストのぶんしか返らないので 3 台とも取る
    - job_name: pve-node
      metrics_path: /pve
      params:
        cluster:
        - "0"
        module:
        - default
        node:
        - "1"
        target:
        - localhost
      static_configs:
      - targets:
        - 192.168.1.79:9221
