# Windows機 (desktop-6vkqmqj) 上の Strata (OpenAI互換, APIキー必須) へ tailnet 経由で出ていく egress Service。
# lmstudio-egress.yaml と同じ ProxyGroup egress パターン。
# Strata は 100.121.22.43:8080 のみで listen、PC側FWは egress-pg-0/1 の tailnet IP からのみ許可。
# 解決名: strata.ai.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: ai
  annotations:
    tailscale.com/tailnet-fqdn: desktop-6vkqmqj.ayu-mamba.ts.net
    tailscale.com/proxy-group: egress-pg
spec:
  type: ExternalName
  externalName: placeholder.tailscale.svc.cluster.local # operator が上書きする
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
