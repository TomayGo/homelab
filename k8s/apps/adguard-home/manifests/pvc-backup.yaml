# PVC を tar → zstd -19 → Cloudflare R2 に送る。2世代残す。R2 の認証情報は Secret r2-backup（SOPS）（docs/phase2.md）
# 元の PVC は直接マウントしない（RWO なので元の Pod と同じノードに縛られ、そのノードが満杯だと Pending になる）。
#   <名前>       毎晩動く。snap-backup が VolumeSnapshot を取り、<名前>-run から Job を作って終わるまで待つ
#   <名前>-run   suspend のままのテンプレート。スナップショットからクローン PVC（generic ephemeral volume）を作って
#                pvc-backup を動かす。どのノードでも動ける。Job を消すとクローン PVC も消える
# クローン PVC の storage は元の PVC 以上にする（元の PVC を広げたらここも直す。小さいとプロビジョニングに失敗する）
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-backup
  namespace: dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pvc-backup
  namespace: dns
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-backup
  namespace: dns
subjects:
- kind: ServiceAccount
  name: pvc-backup
  namespace: dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pvc-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-agh-primary
  namespace: dns
spec:
  schedule: 10 3 * * *
  timeZone: Asia/Tokyo
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: pvc-backup
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: snap-backup
            image: ghcr.io/tomaygo/backup-tools:sha-3cbb613
            command:
            - /bin/sh
            - /usr/local/bin/snap-backup
            env:
            - name: SNAP_PVCS
              value: conf-agh-primary-0 work-agh-primary-0
            - name: RUN_CRONJOB
              value: pvc-backup-agh-primary-run
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-agh-primary-run
  namespace: dns
spec:
  schedule: 10 3 * * *
  timeZone: Asia/Tokyo
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:sha-3cbb613
            env:
            - name: BACKUP_NAME
              value: dns/agh-primary
            - name: ZSTD_THREADS
              value: '6'
            - name: EXCLUDES
              value: conf/lost+found work/lost+found work/data/filters
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: HOME
              value: /tmp
            envFrom:
            - secretRef:
                name: r2-backup
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: '6'
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
            volumeMounts:
            - name: conf
              mountPath: /src/conf
            - name: work
              mountPath: /src/work
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: conf
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    app.kubernetes.io/managed-by: snap-backup
                spec:
                  accessModes:
                  - ReadWriteOnce
                  storageClassName: ceph-rbd
                  dataSource:
                    apiGroup: snapshot.storage.k8s.io
                    kind: VolumeSnapshot
                    name: conf-agh-primary-0-backup
                  resources:
                    requests:
                      storage: 256Mi
          - name: work
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    app.kubernetes.io/managed-by: snap-backup
                spec:
                  accessModes:
                  - ReadWriteOnce
                  storageClassName: ceph-rbd
                  dataSource:
                    apiGroup: snapshot.storage.k8s.io
                    kind: VolumeSnapshot
                    name: work-agh-primary-0-backup
                  resources:
                    requests:
                      storage: 16Gi
          - name: tmp
            emptyDir: {}
---
