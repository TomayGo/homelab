apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.io/ip-allocated-from-pool: lan-pool
  name: agh-lan
  namespace: dns
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: dns-udp
    nodePort: 30175
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    nodePort: 30175
    port: 53
    protocol: TCP
    targetPort: 53
  selector:
    app: agh
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: agh-primary
  namespace: dns
spec:
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: agh
    role: primary
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: agh-primary
  name: agh-primary-tailnet
  namespace: dns
spec:
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: agh
    role: primary
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agh-replica
  namespace: dns
spec:
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: agh
    role: replica
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: agh-replica
  name: agh-replica-tailnet
  namespace: dns
spec:
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: agh
    role: replica
  type: ClusterIP
