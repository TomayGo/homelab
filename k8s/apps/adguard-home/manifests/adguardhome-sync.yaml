apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome-sync
  namespace: dns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: adguardhome-sync
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-18T05:24:22+09:00'
      labels:
        app: adguardhome-sync
    spec:
      containers:
      - args:
        - run
        - --config
        - /config/config.yaml
        image: ghcr.io/bakito/adguardhome-sync:v0.9.4
        imagePullPolicy: Always
        name: adguardhome-sync
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        secret:
          defaultMode: 420
          secretName: adguardhome-sync-config
---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-sync
  namespace: dns
spec:
  ports:
  - name: api
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: adguardhome-sync
  type: ClusterIP
