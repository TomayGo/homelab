apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-exporter
  namespace: dns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: adguard-exporter
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: adguard-exporter
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: adguard-exporter-config
        image: ghcr.io/henrywhitaker3/adguard-exporter:latest
        imagePullPolicy: Always
        name: adguard-exporter
        ports:
        - containerPort: 9618
          name: metrics
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-exporter
  namespace: dns
spec:
  ports:
  - name: metrics
    port: 9618
    protocol: TCP
    targetPort: 9618
  selector:
    app: adguard-exporter
  type: ClusterIP
