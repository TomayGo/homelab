# PVC を tar → zstd -19 → Cloudflare R2 に送る（images/backup-tools/pvc-backup.sh）。2世代残す
# R2 の認証情報は Secret r2-backup（SOPS）。2026-10-09 に有効化した（docs/phase2.md）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: pricetracker
spec:
  schedule: 55 3 * * *
  timeZone: Asia/Tokyo
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr-pull
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: pricetracker
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:sha-66c0fe7
            env:
            - name: BACKUP_NAME
              value: pricetracker/data
            - name: EXCLUDES
              value: lost+found
            - name: SQLITE_DBS
              value: pricetracker.db
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: HOME
              value: /tmp
            envFrom:
            - secretRef:
                name: r2-backup
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '2'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: data
              mountPath: /src
              readOnly: false
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: pricetracker-data
              readOnly: false
          - name: tmp
            emptyDir: {}
