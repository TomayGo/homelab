# クローン PVC の storage は元の PVC 以上にする（元の PVC を広げたらここも直す。小さいとプロビジョニングに失敗する）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-media
spec:
  schedule: 58 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: snap-backup
            image: ghcr.io/tomaygo/backup-tools:sha-01d8a40
            env:
            - name: SNAP_PVCS
              value: netbox-media
            - name: RUN_CRONJOB
              value: pvc-backup-media-run
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-media-run
spec:
  schedule: 58 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:sha-01d8a40
            env:
            - name: BACKUP_NAME
              value: netbox/media
            - name: ZSTD_THREADS
              value: '6'
            - name: EXCLUDES
              value: lost+found
            securityContext:
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: media
              mountPath: /src
          volumes:
          - name: media
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    app.kubernetes.io/managed-by: snap-backup
                spec:
                  accessModes:
                  - ReadWriteOnce
                  storageClassName: ceph-rbd
                  dataSource:
                    apiGroup: snapshot.storage.k8s.io
                    kind: VolumeSnapshot
                    name: netbox-media-backup
                  resources:
                    requests:
                      storage: 1Gi
