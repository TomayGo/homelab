# Argo CD の UI を tailnet に公開（argocd.ayu-mamba.ts.net、http のみ）
apiVersion: v1
kind: Service
metadata:
  name: argocd-tailnet
  namespace: argocd
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
