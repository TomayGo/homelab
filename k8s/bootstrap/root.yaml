# app-of-apps のルート。初回だけ kubectl apply -f で作る
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:TomayGo/homelab.git
    targetRevision: main
    path: k8s/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
