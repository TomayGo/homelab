# PVC を tar → zstd -19 → Cloudflare R2 に送る。2世代残す。R2 の認証情報は Secret r2-backup（SOPS）（docs/phase2.md）
# 元の PVC は直接マウントしない（RWO なので元の Pod と同じノードに縛られ、そのノードが満杯だと Pending になる）。
#   pvc-backup       毎晩動く。snap-backup が VolumeSnapshot を取り、pvc-backup-run から Job を作って終わるまで待つ
#   pvc-backup-run   suspend のままのテンプレート。スナップショットからクローン PVC（generic ephemeral volume）を作って
#                    pvc-backup を動かす。どのノードでも動ける。Job を消すとクローン PVC も消える
#
# 全アプリで同じ部分だけをここに置く。アプリごとの部分は k8s/apps/<アプリ>/manifests/pvc-backup/ のパッチが足す:
#   名前、schedule、image のタグ、SNAP_PVCS / RUN_CRONJOB、runAsUser / runAsGroup、BACKUP_NAME などの env、
#   スナップショットから作るクローン PVC（volumes と volumeMounts）
# PATCH-ME と書いてある値は、パッチが上書きしないと apply で弾かれる（黙って動かないように、わざと不正な値にしてある）
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
spec:
  schedule: PATCH-ME
  timeZone: Asia/Tokyo
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: pvc-backup
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: snap-backup
            image: ghcr.io/tomaygo/backup-tools:PATCH-ME
            command:
            - /bin/sh
            - /usr/local/bin/snap-backup
            env:
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-run
spec:
  schedule: PATCH-ME
  timeZone: Asia/Tokyo
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsUser: PATCH-ME
            runAsGroup: PATCH-ME
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/tomaygo/backup-tools:PATCH-ME
            env:
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: HOME
              value: /tmp
            envFrom:
            - secretRef:
                name: r2-backup
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: '6'
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
