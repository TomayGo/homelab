# snap-backup（pvc-backup の CronJob）が VolumeSnapshot と Job を作るための権限。namespace は使う側の kustomization が付ける
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pvc-backup
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-backup
subjects:
- kind: ServiceAccount
  name: pvc-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pvc-backup
