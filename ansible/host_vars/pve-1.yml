# pve-1
lan_address: 192.168.1.79/24
tb0_address: 10.0.4.1/30
tb1_address: 10.0.4.5/30
# dummy0 のアドレス。OSPF の router-id も兼ねる
mesh_loopback: 10.0.4.101
vmbr9_address: 10.10.1.1/28
manual_ifaces:
  - nic2
# 他ノードの loopback への ECMP（table 100）
mesh_ecmp_routes:
  - dest: 10.0.4.102
    nexthops:
      - { via: 10.0.4.2, dev: tb0 }
      - { via: 10.0.4.6, dev: tb1 }
  - dest: 10.0.4.103
    nexthops:
      - { via: 10.0.4.6, dev: tb1 }
      - { via: 10.0.4.2, dev: tb0 }
# Thunderbolt NHI の PCI バス番号（IRQ 固定用）
tb_nhi_pci_bus: "c8"
