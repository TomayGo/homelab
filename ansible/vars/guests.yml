# 一点物のゲストの定義（手順書 6-1）。playbooks/guests.yml が、ここにある項目だけを現状と比べ、違う項目だけを API で更新する
# 管理しない項目：ディスク（scsi*, rootfs, efidisk*, unused*）、パススルー（hostpci*, usb*, dev*）、smbios1, vmgenid, meta
# Talos VM（201〜203）は tofu/proxmox で管理する
guests:
- vmid: 103
  node: pve-1
  type: qemu
  config:
    name: ap
    cores: 6
    sockets: 1
    cpu: host
    memory: 2048
    onboot: 1
    bios: seabios
    machine: q35
    ostype: l26
    scsihw: virtio-scsi-single
    numa: 0
    boot: order=scsi0;net0
    net0: virtio=BC:24:11:97:AC:15,bridge=vmbr0,mtu=1500
- vmid: 106
  node: pve-1
  type: qemu
  config:
    name: mc
    cores: 8
    sockets: 1
    cpu: host
    memory: 12288
    onboot: 1
    ostype: l26
    scsihw: virtio-scsi-single
    numa: 0
    boot: order=scsi0;net0
    net0: virtio=BC:24:11:0A:7A:AF,bridge=vmbr0,mtu=1460
- vmid: 500
  node: pve-2
  type: lxc
  config:
    hostname: discordbots
    cores: 6
    memory: 2048
    swap: 0
    onboot: 1
    features: nesting=1
    net0: name=net0,bridge=vmbr0,hwaddr=BC:24:11:A6:4C:1E,ip=dhcp,type=veth
    ostype: ubuntu
- vmid: 101
  node: pve-2
  type: qemu
  config:
    name: dtv
    cores: 8
    sockets: 1
    cpu: host
    memory: 6144
    balloon: 2048
    onboot: 1
    agent: 1
    bios: seabios
    machine: q35
    ostype: l26
    scsihw: virtio-scsi-single
    numa: 0
    boot: order=scsi0;net0
    net0: virtio=BC:24:11:82:FE:34,bridge=vmbr0
- vmid: 903
  node: pve-3
  type: lxc
  config:
    hostname: netbox
    cores: 4
    memory: 4096
    swap: 1024
    onboot: 0
    features: nesting=1
    net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:E5:EE:28,ip=dhcp,type=veth
    ostype: debian
