# /etc/systemd/system/hostapd.service.d/restart-always.conf
# 2026-07-28: hostapdが「exit 0」で死ぬケース (5GHz HT_SCAN失敗 / libc更新に伴う再起動レース)
# があり、Restart=on-failure では再起動されず約1時間APが停止していたため always に変更。
#
# 注: StartLimit* は [Unit] セクションのキー ([Service] に書くと無視される)
[Unit]
# レース起因の死は再試行で復旧するので粘る。5分で20回(RestartSec=5なので実質100秒分)
# 試してもダメなら設定不備とみなしてfailedで停止 → hostapd_up=0 でアラート。
StartLimitIntervalSec=300
StartLimitBurst=20

[Service]
Restart=always
RestartSec=5
