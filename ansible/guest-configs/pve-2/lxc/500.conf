arch: amd64
cores: 6
features: nesting=1
hostname: discordbots
memory: 2048
net0: name=net0,bridge=vmbr0,hwaddr=BC:24:11:A6:4C:1E,ip=dhcp,type=veth
onboot: 1
ostype: ubuntu
rootfs: ceph-pool:vm-500-disk-0,size=16G
swap: 0
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
