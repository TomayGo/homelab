arch: amd64
cores: 4
features: nesting=1
hostname: netbox
memory: 4096
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:E5:EE:28,ip=dhcp,type=veth
onboot: 0
ostype: debian
rootfs: ceph-pool:vm-903-disk-0,size=32G
swap: 1024
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
