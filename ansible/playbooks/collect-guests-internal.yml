# ゲスト（ap、mc）の管理対象ファイルを collected/<host>/ に回収する（読み取りのみ。collected/ は gitignore 対象）
# 一覧は roles/host_files が配るもの（host_vars/<host>/host_files.yml）と同じ。host_files が空のホスト（sdr）では何もしない
- name: Collect managed files from guests
  hosts: guests
  gather_facts: false
  tasks:
    - name: Fetch files
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ playbook_dir }}/../collected/"
        fail_on_missing: false
      loop: "{{ host_files | map(attribute='path') | list }}"
