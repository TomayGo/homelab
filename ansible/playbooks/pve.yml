# PVE ホスト（pve-1/2/3）。本適用は1台ずつ。ネットワークと FRR の変更後は OSPF の隣接と ceph -s を確認してから次へ
- name: PVE hosts
  hosts: pve
  gather_facts: false
  serial: 1
  # ロールごとにロール名のタグを付けてある。1つだけ流すときは --tags <ロール名>（全部流すときはタグを付けない）
  roles:
    - { role: pve_network, tags: [pve_network] }
    - { role: frr, tags: [frr] }
    - { role: sysctl, tags: [sysctl] }
    - { role: thunderbolt_net, tags: [thunderbolt_net] }
    - { role: thunderbolt_irq, tags: [thunderbolt_irq] }
    - { role: node_exporter, tags: [node_exporter] }
    - { role: frr_exporter, tags: [frr_exporter] }
    - { role: pve_exporter, tags: [pve_exporter] }
    - { role: pvectl, tags: [pvectl] }
