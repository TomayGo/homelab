# guests（ap、mc）は tailnet 経由。Tailscale の ACL で tag:iac-guest への root SSH を accept にしてある（docs/phase6.md）
all:
  children:
    pve:
      hosts:
        pve-1:
          ansible_host: 192.168.1.79
        pve-2:
          ansible_host: 192.168.1.80
        pve-3:
          ansible_host: 192.168.1.81
      vars:
        ansible_user: root
    guests:
      hosts:
        ap:
          ansible_host: 100.65.199.15
        mc:
          ansible_host: 100.86.49.112
        # LXC 104（rtl_tcp）。sshd があり、LAN から鍵で入れる
        sdr:
          ansible_host: 192.168.1.86
      vars:
        ansible_user: root
    # RTL-SDR（0bda:2838）を挿す PVE ホスト。playbooks/sdr.yml（docs/manual-ops.md の「RTL-SDR」）
    # pve-1 の USB-A はすべて ap（VM 103）に渡したコントローラーにつながり、残りの USB4 は TB メッシュで使っているので、pve-2 に挿す
    sdr_usb_hosts:
      hosts:
        pve-2:
