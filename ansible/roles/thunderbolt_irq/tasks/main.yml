- name: /usr/local/bin/thunderbolt-irq-affinity.sh
  ansible.builtin.template:
    src: thunderbolt-irq-affinity.sh.j2
    dest: /usr/local/bin/thunderbolt-irq-affinity.sh
    owner: root
    group: root
    mode: "0755"
  notify: Rerun thunderbolt-irq-affinity

- name: /etc/systemd/system/thunderbolt-irq-affinity.service
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_files:
      - thunderbolt-irq-affinity.service
    systemd_unit_notify: Rerun thunderbolt-irq-affinity

- name: thunderbolt-irq-affinity.service is enabled
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: enable
  vars:
    systemd_unit_name: thunderbolt-irq-affinity
