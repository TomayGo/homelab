- name: Binary of frr_exporter
  ansible.builtin.import_role:
    name: release_binary
  vars:
    release_binary_name: frr_exporter
    release_binary_repo: tynany/frr_exporter
    release_binary_version: "{{ frr_exporter_version }}"
    release_binary_notify: Restart frr_exporter

- name: /etc/systemd/system/frr_exporter.service
  ansible.builtin.copy:
    src: frr_exporter.service
    dest: /etc/systemd/system/frr_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart frr_exporter

- name: frr_exporter is enabled and running
  ansible.builtin.systemd_service:
    name: frr_exporter
    enabled: true
    state: started
