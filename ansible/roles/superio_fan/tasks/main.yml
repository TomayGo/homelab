- name: /usr/local/sbin/superio-fan-metrics
  ansible.builtin.copy:
    src: superio-fan-metrics
    dest: /usr/local/sbin/superio-fan-metrics
    owner: root
    group: root
    mode: "0755"

- name: /usr/local/sbin/superio-fan-control
  ansible.builtin.copy:
    src: superio-fan-control
    dest: /usr/local/sbin/superio-fan-control
    owner: root
    group: root
    mode: "0755"
  notify: Restart superio-fan-control

- name: /etc/default/superio-fan-metrics
  ansible.builtin.template:
    src: superio-fan-metrics.default.j2
    dest: /etc/default/superio-fan-metrics
    owner: root
    group: root
    mode: "0644"
  notify: Restart superio-fan-control

# metrics の unit を変えただけでは fan-control を再起動しない（再起動すると起動 PWM が MIN に戻り、移動平均を取り直す）。
# fan-control を再起動するのは、そのスクリプト、unit、両方が読む /etc/default/superio-fan-metrics が変わったときだけ
- name: superio-fan-metrics service and timer
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_files:
      - superio-fan-metrics.service
      - superio-fan-metrics.timer
    systemd_unit_notify: Reload systemd for superio-fan-metrics

- name: /etc/systemd/system/superio-fan-control.service
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_files:
      - superio-fan-control.service
    systemd_unit_notify:
      - Reload systemd for superio-fan-metrics
      - Restart superio-fan-control

- name: Flush handlers before starting the timer
  ansible.builtin.meta: flush_handlers

- name: superio-fan-metrics.timer is enabled and running
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: enable
  vars:
    systemd_unit_name: superio-fan-metrics.timer
    systemd_unit_state: started

- name: superio-fan-control.service is enabled and running, or stopped and disabled
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: enable
  vars:
    systemd_unit_name: superio-fan-control.service
    systemd_unit_enabled: "{{ superio_fan_control_enabled }}"
    systemd_unit_state: "{{ 'started' if superio_fan_control_enabled else 'stopped' }}"
