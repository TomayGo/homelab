# USB4 ECMP routing
net.ipv4.ip_forward = 1
net.ipv4.fib_multipath_hash_policy = 1
net.ipv4.tcp_reordering = 30
net.ipv4.tcp_max_reordering = 300

# TCP MTU black hole detection (2026-07-22: mitigate large-packet-only
# stalls on the USB4 mesh; see k8s-cluster-setup.md incident notes)
net.ipv4.tcp_mtu_probing = 1
