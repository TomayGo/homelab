# GitHub のリリース（<名前>-<版>.linux-amd64.tar.gz）からバイナリを 1 つ /usr/local/bin に入れる。
# 単体では使わない。呼ぶ側のロール（node_exporter、frr_exporter）が import_role の vars で渡す:
#   release_binary_name     バイナリ名（tar の中のディレクトリ名とファイル名も同じ）
#   release_binary_repo     GitHub の owner/repo
#   release_binary_version  入れる版（v は付けない）
#   release_binary_notify   入れ替えたときに呼ぶ handler（呼ぶ側のロールにある）
- name: Installed {{ release_binary_name }} version
  ansible.builtin.command: /usr/local/bin/{{ release_binary_name }} --version
  register: release_binary_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install {{ release_binary_name }} {{ release_binary_version }}
  when: ("version " + release_binary_version + " ") not in (release_binary_installed.stdout + release_binary_installed.stderr)
  block:
    - name: Download and unpack {{ release_binary_name }}
      ansible.builtin.unarchive:
        src: "https://github.com/{{ release_binary_repo }}/releases/download/v{{ release_binary_version }}/{{ release_binary_name }}-{{ release_binary_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    # check mode では展開されないので、コピーの代わりに「入れ替える予定」を表示する
    - name: Install the {{ release_binary_name }} binary (check mode)
      ansible.builtin.debug:
        msg: "would install {{ release_binary_name }} {{ release_binary_version }}"
      changed_when: true
      when: ansible_check_mode

    - name: Install the {{ release_binary_name }} binary
      when: not ansible_check_mode
      ansible.builtin.copy:
        src: "/tmp/{{ release_binary_name }}-{{ release_binary_version }}.linux-amd64/{{ release_binary_name }}"
        dest: "/usr/local/bin/{{ release_binary_name }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: "{{ release_binary_notify }}"
