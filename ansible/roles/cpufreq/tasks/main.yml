- name: /usr/local/bin/cpufreq-epp.sh
  ansible.builtin.template:
    src: cpufreq-epp.sh.j2
    dest: /usr/local/bin/cpufreq-epp.sh
    owner: root
    group: root
    mode: "0755"
  notify: Rerun cpufreq-epp

- name: /etc/systemd/system/cpufreq-epp.service
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_files:
      - cpufreq-epp.service
    systemd_unit_notify: Rerun cpufreq-epp

- name: cpufreq-epp.service is enabled
  ansible.builtin.import_role:
    name: systemd_unit
    tasks_from: enable
  vars:
    systemd_unit_name: cpufreq-epp
