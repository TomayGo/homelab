- name: /etc/udev/rules.d/85-thunderbolt-net.rules
  ansible.builtin.copy:
    src: 85-thunderbolt-net.rules
    dest: /etc/udev/rules.d/85-thunderbolt-net.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev

- name: /etc/udev/rules.d/99-thunderbolt-net.rules
  ansible.builtin.copy:
    src: 99-thunderbolt-net.rules
    dest: /etc/udev/rules.d/99-thunderbolt-net.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev

- name: /etc/modules-load.d/thunderbolt-net.conf
  ansible.builtin.copy:
    src: thunderbolt-net.conf
    dest: /etc/modules-load.d/thunderbolt-net.conf
    owner: root
    group: root
    mode: "0644"

- name: /etc/systemd/system/thunderbolt-ecmp.service
  ansible.builtin.copy:
    src: thunderbolt-ecmp.service
    dest: /etc/systemd/system/thunderbolt-ecmp.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: /usr/local/bin/thunderbolt-ecmp-setup.sh
  ansible.builtin.copy:
    src: thunderbolt-ecmp-setup.sh
    dest: /usr/local/bin/thunderbolt-ecmp-setup.sh
    owner: root
    group: root
    mode: "0755"

- name: /usr/local/bin/thunderbolt-net-recover.sh
  ansible.builtin.copy:
    src: thunderbolt-net-recover.sh
    dest: /usr/local/bin/thunderbolt-net-recover.sh
    owner: root
    group: root
    mode: "0755"

- name: thunderbolt-ecmp.service is enabled
  ansible.builtin.systemd_service:
    name: thunderbolt-ecmp
    enabled: true

# NHI が wedge したときのイベントストーム (カーネルメモリリーク) を検知して unbind する。経緯はスクリプト冒頭
- name: /usr/local/bin/tb-storm-watchdog.sh
  ansible.builtin.copy:
    src: tb-storm-watchdog.sh
    dest: /usr/local/bin/tb-storm-watchdog.sh
    owner: root
    group: root
    mode: "0755"

- name: /etc/systemd/system/tb-storm-watchdog.{service,timer}
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - tb-storm-watchdog.service
    - tb-storm-watchdog.timer
  notify: Reload systemd

- name: Flush handlers so the new timer unit is known before enabling it
  ansible.builtin.meta: flush_handlers

# check mode では unit がまだ置かれていないので失敗する
- name: tb-storm-watchdog.timer is enabled and running
  ansible.builtin.systemd_service:
    name: tb-storm-watchdog.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
