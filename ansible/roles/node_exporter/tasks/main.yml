- name: Binary of node_exporter
  ansible.builtin.import_role:
    name: release_binary
  vars:
    release_binary_name: node_exporter
    release_binary_repo: prometheus/node_exporter
    release_binary_version: "{{ node_exporter_version }}"
    release_binary_notify: Restart node_exporter

# textfile collector の置き場。いまは thunderbolt_net の tb-storm-watchdog.sh が書く
- name: /var/lib/node_exporter/textfile_collector
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: /etc/systemd/system/node_exporter.service
  ansible.builtin.copy:
    src: node_exporter.service
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: node_exporter is enabled and running
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
