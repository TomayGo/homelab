# host_vars/<host>/host_files.yml の一覧を配る。中身は ansible/host_files/<host>/<パス>（template: true のものは .j2）
# 既存のディレクトリの所有者と権限は変えない（root 以外が持つディレクトリもあるため）。ないときだけ作る
- name: Directories
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
  loop: "{{ host_files }}"
  loop_control:
    label: "{{ item.path | dirname }}"

- name: Files (copy)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host_files/{{ inventory_hostname }}{{ item.path }}"
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files | rejectattr('template', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_files_copy

- name: Files (template)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../host_files/{{ inventory_hostname }}{{ item.path }}.j2"
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files | selectattr('template', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_files_template
  # 秘密情報（Wi-Fi のパスフレーズなど）を diff に出さない
  diff: false

# ループのタスクに notify: "{{ item.notify }}" と書くと、どれか 1 つが変わっただけで全項目の handler が動く
# （2026-10-12、metrics.sh だけの変更で hostapd 再起動と update-grub まで走った）。変わったファイルの分だけ通知する
- name: Notify handlers for changed files
  ansible.builtin.debug:
    msg: "{{ item.item.path }} -> {{ item.item.notify }}"
  loop: "{{ (host_files_copy.results + host_files_template.results) | selectattr('changed') | selectattr('item.notify', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: true
  notify: "{{ item.item.notify }}"
