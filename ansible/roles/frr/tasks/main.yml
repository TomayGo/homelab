- name: /etc/frr/frr.conf
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Reload frr

- name: /etc/frr/daemons
  ansible.builtin.copy:
    src: daemons
    dest: /etc/frr/daemons
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr
