- name: Restart rtl_tcp
  ansible.builtin.systemd_service:
    name: rtl_tcp
    state: restarted
    daemon_reload: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart rtl_tcp_relay
  ansible.builtin.systemd_service:
    name: rtl_tcp_relay
    state: restarted
    daemon_reload: true
