name: lint

# 書式と文法だけを見る。クラスタにもホストにも触らず、秘密情報（age 鍵）も使わない。
# 設定は「いまのツリーが通る水準」から始めている: .yamllint / .shellcheckrc / ruff.toml / ansible/.ansible-lint
# ツールの版は下の env に固定してある。Renovate は uses: の行しか上げないので、ツールを上げるときは手で書き換える。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # tofu/talos/main.tf の kubernetes_version に合わせる
  KUBERNETES_VERSION: 1.36.2
  # tofu/*/versions.tf を書いたときの版
  TOFU_VERSION: 1.13.1
  PYTHON_VERSION: "3.13"
  YAMLLINT_VERSION: 1.38.0
  RUFF_VERSION: 0.17.4
  # PVE ホストで実際に使っている ansible-core（Debian パッケージ、docs/phase5.md）に合わせる
  ANSIBLE_CORE_VERSION: 2.19.11
  ANSIBLE_LINT_VERSION: 26.11.0

jobs:
  shell:
    name: shellcheck / actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck と actionlint を入れる
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/dl"
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" shellcheck.tar.xz "$ACTIONLINT_SHA256" actionlint.tar.gz | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" actionlint "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Jinja テンプレートの *.sh.j2 はそのままでは読めないので対象外
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      # run: の中のシェルも、PATH にある shellcheck で見てくれる
      - name: actionlint
        run: actionlint -color

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "yamllint==${YAMLLINT_VERSION}"
      - run: yamllint -f github .

  python:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
      # ansible.cfg の collections_path と同じ場所に入れる
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      # playbook の syntax-check も ansible-lint が流す。*.sops.yaml は復号しない（age 鍵が無くても通る）
      - run: ansible-lint

  tofu:
    name: tofu fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff tofu

  k8s:
    name: kustomize build / kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kustomize と kubeconform を入れる
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/dl"
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "$KUSTOMIZE_SHA256" kustomize.tar.gz "$KUBECONFORM_SHA256" kubeconform.tar.gz | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          tar -xzf kubeconform.tar.gz kubeconform
          install -m 0755 kustomize kubeconform "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: ksops を使わない kustomization を build して kubeconform にかける
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r k; do
            dir=$(dirname "$k")
            # ksops（generators:）は age 鍵が無いと build できない。Component は単体では build しない
            if grep -q '^generators:' "$k"; then
              echo "skip（ksops）: $dir"
              continue
            fi
            if grep -q '^kind: Component' "$k"; then
              echo "skip（Component）: $dir"
              continue
            fi
            echo "::group::$dir"
            # スキーマの無い種類（CRD 自体や、カタログに無い CR）は検査せずに通す
            if ! kustomize build "$dir" | kubeconform \
              -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -; then
              rc=1
            fi
            echo "::endgroup::"
          done < <(git ls-files ':(glob)k8s/**/kustomization.yaml')
          exit "$rc"
