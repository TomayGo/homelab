# 全ノード共通。gen config（v1.13 契約）の既定値との差分だけを書く
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      default-not-ready-toleration-seconds: "30"
      default-unreachable-toleration-seconds: "30"
    # memory は 2026-11 の 7 日間の p95（1301Mi）× 1.1。既定の 512Mi では実際の半分も予約されない。
    # cpu は既定値のまま（resources を書くと既定値ごと置き換わる）
    resources:
      requests:
        cpu: 200m
        memory: 1440Mi
  etcd:
    extraArgs:
      # etcd のメトリクスを http で出す（kube-prometheus-stack の kubeEtcd が scrape する）。
      # 既定では client ポート（2379、mTLS）にしか出ていない。2026-11-16 の #86 のロールアウトで
      # follower の ReadIndex が 13 秒止まったが、peer RTT や fsync の時系列がなく原因を絞れなかった
      listen-metrics-urls: http://0.0.0.0:2381
  controllerManager:
    extraArgs:
      node-monitor-period: 2s
      node-monitor-grace-period: 16s
    # memory は 2026-11 の 7 日間の p95（130Mi）× 1.1。既定は 256Mi
    resources:
      requests:
        cpu: 50m
        memory: 144Mi
machine:
  install:
    # talosctl upgrade では書き換わらないので v1.13.6 のまま（qemu-guest-agent 入りの schematic）
    image: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.13.6
  kubelet:
    extraArgs:
      node-status-update-frequency: 4s
  nodeLabels:
    # 全ノードが control-plane なので、これがあると MetalLB が announce できるノードがなくなる
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
---
# gen config が出す HostnameConfig（auto: stable）は消し、各ノードのパッチで hostname だけのものを入れ直す
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
